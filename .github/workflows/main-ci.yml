name: Main CI Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  call-reusable-build:
    uses: ./.github/workflows/reusable-build.yml
    with:
      dotnet-version: '8.0.x'
      environment-name: 'Development'
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
