name: Testing_Actions

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-24.04
    env:
      node-version: "22.x"
      dotnet-version: "10.x"
      python-version: "3.13"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.node-version }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.dotnet-version }}

      - uses: actions/setup-python@v4
        with:
          python-version: ${{ env.python-version }}

      # Create a 100-line test file
      - name: Create test artifact file
        run: |
          python3 << 'EOF'
          with open('test-artifact.txt', 'w') as f:
              for i in range(1, 101):
                  f.write(f"Line {i}: This is a test line for artifact upload.\n")
          print("✓ Created test-artifact.txt with 100 lines")
          EOF

      # Upload artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-artifact
          path: test-artifact.txt
          retention-days: 30
